<!DOCTYPE html>
<html>
<head><title>Unified Monitoring</title>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#eee}
  .tabs{display:flex;background:#000}
  .tabs button{flex:1;padding:12px;background:#222;color:#eee;border:none;cursor:pointer}
  .tabs button.active{background:#444}
  iframe{width:100%;height:90vh;border:none}
</style></head>
<body>
<div class="tabs">
  <button class="active" onclick="show('grafana')">Grafana</button>
  <button onclick="show('graphite')">Graphite</button>
  <button onclick="show('nagios')">Nagios</button>
</div>
<iframe id="frame" src="http://localhost:1142"></iframe>
<script>
function show(t){
  const urls = {grafana:'http://localhost:1142', graphite:'http://localhost:1141', nagios:'http://localhost:1140'};
  document.getElementById('frame').src = urls[t];
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
</script>
</body>
</html>
